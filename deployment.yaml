apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-app
  labels:
    run: dealership-app
spec:
  replicas: 1
  selector:
    matchLabels:
      run: dealership-app
  template:
    metadata:
      labels:
        run: dealership-app
    spec:
      containers:
      - name: dealership-app
        image: dealership:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-service
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30001
  selector:
    run: dealership-app
